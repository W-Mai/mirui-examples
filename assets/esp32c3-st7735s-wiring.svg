<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="568" viewBox="0 0 1080 568" role="img" aria-labelledby="title description">
  <title id="title">ESP32-C3 Super Mini to ST7735S TFT wiring</title>
  <desc id="description">ESP32-C3 viewed from the component side with USB-C at the top. The MSP1443 display is viewed from the back with its header on the left. GPIO5 connects to SCK, GPIO4 to SDA, GPIO6 to CS, GPIO7 to A0, GPIO3 to RESET, GPIO2 to LED, 3V3 to VCC, and GND to GND.</desc>
  <defs>
    <linearGradient id="pcb" x2="1" y2="1">
      <stop stop-color="#344244"/><stop offset="1" stop-color="#10181c"/>
    </linearGradient>
    <linearGradient id="red" x2="1" y2="1">
      <stop stop-color="#dc544b"/><stop offset="1" stop-color="#a93036"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#75818b"/><stop offset=".17" stop-color="#dce4e9"/><stop offset=".62" stop-color="#f0f4f6"/><stop offset="1" stop-color="#909da7"/>
    </linearGradient>
    <linearGradient id="gold" x2="0" y2="1">
      <stop stop-color="#ffe6a3"/><stop offset="1" stop-color="#b27f35"/>
    </linearGradient>
    <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#132437" flood-opacity=".27"/>
    </filter>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".85" class="grid-dot"/>
    </pattern>
    <g id="pad">
      <rect x="-9" y="-8" width="18" height="16" rx="6" fill="url(#gold)" stroke="#a98140"/>
      <circle r="4.4" fill="#151c21" stroke="#e4bd6c" stroke-width="1.5"/>
    </g>
    <g id="header-pin">
      <rect x="-7" y="-7" width="14" height="14" rx="2" fill="#262426" stroke="#703338"/>
      <rect x="-3.5" y="-3.5" width="7" height="7" rx="1" fill="url(#gold)"/>
    </g>
    <g id="capacitor">
      <rect width="13" height="7" rx="1" fill="#c1ad8f"/>
      <path d="M0 0H2V7H0Z M11 0H13V7H11Z" fill="#f0e5d3"/>
    </g>
    <g id="switch">
      <rect width="38" height="24" rx="4" fill="#0f1519"/>
      <rect x="2" y="1" width="34" height="20" rx="3" fill="url(#steel)"/>
      <circle cx="19" cy="11" r="6" fill="#4a5259" stroke="#8f9ca5"/>
    </g>
    <style>
      text { font-family: system-ui, -apple-system, sans-serif; fill: #1c2b35; }
      .bg { fill: #f4f7f9; }
      .grid-dot { fill: #c5d1db; opacity: .52; }
      .secondary { fill: #4e6271; }
      .silk { fill: #f7ede1; font: 650 14px ui-monospace, Menlo, monospace; dominant-baseline: middle; }
      .mark { fill: #e5ded3; font: 600 10px ui-monospace, Menlo, monospace; }
      .pin-tag { fill: #fff; font: 700 13px ui-monospace, Menlo, monospace; dominant-baseline: middle; text-anchor: middle; }
      .insulation { fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .wire-edge { stroke: #192631; stroke-width: 9; opacity: .84; }
      .wire { stroke: currentColor; stroke-width: 5.5; }
      .wire-glint { stroke: #fff; stroke-width: 1; opacity: .32; }
      @media (prefers-color-scheme: dark) {
        text { fill: #ecf4f9; }
        .bg { fill: #101922; }
        .grid-dot { fill: #425264; }
        .secondary { fill: #aec0ce; }
        .wire-edge { stroke: #02070c; }
      }
    </style>
  </defs>
  <rect class="bg" width="1080" height="568" rx="24"/>
  <rect x="24" y="91" width="1032" height="432" rx="16" fill="url(#grid)"/>
  <text x="34" y="51" font-size="30" font-weight="730">ESP32-C3 display wiring</text>
  <text class="secondary" x="35" y="77" font-size="15">Super Mini · ST7735S 128 × 128 SPI TFT</text>

