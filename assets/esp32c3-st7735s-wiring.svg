      <circle cx="319" cy="193" r="2.4"/><circle cx="315" cy="290" r="2.4"/><circle cx="309" cy="352" r="2.4"/>
      <circle cx="208" cy="300" r="2.4"/><circle cx="267" cy="365" r="2.4"/>
    </g>
    <rect x="214" y="118" width="83" height="76" rx="8" fill="#0d151b"/>
    <rect x="215" y="115" width="81" height="73" rx="7" fill="url(#steel)" stroke="#667781"/>
    <rect x="219" y="117" width="73" height="15" rx="5" fill="#27333e" stroke="#f5f8fa" stroke-width="1.5"/>
    <path d="M232 125H279" stroke="#a6b0ba" stroke-width="2" stroke-linecap="round"/>
    <path d="M222 138H288M222 181H289" stroke="#7c8a94" opacity=".55"/>
    <text class="mark" x="255" y="162" text-anchor="middle" style="fill:#3d4d59">USB-C</text>
    <use href="#switch" x="209" y="200"/><use href="#switch" x="263" y="200"/>
    <text class="mark" x="228" y="236" text-anchor="middle">BOOT</text>
    <text class="mark" x="282" y="236" text-anchor="middle">RST</text>
    <rect x="221" y="250" width="69" height="69" rx="5" fill="#11181b" stroke="#4f5557"/>
    <rect x="225" y="254" width="61" height="61" rx="3" fill="#272f33"/>
    <circle cx="231" cy="260" r="2" fill="#8c9699"/>
    <text class="mark" x="255" y="284" text-anchor="middle">ESP32-C3</text>
    <text class="mark" x="255" y="298" text-anchor="middle" opacity=".64">RISCV</text>
    <rect x="219" y="330" width="28" height="17" rx="2" fill="url(#steel)" stroke="#929ba0"/>
    <path d="M225 339H241" stroke="#64717a"/>
    <rect x="271" y="337" width="17" height="12" rx="2" fill="#0d1418" stroke="#667573"/>
    <use href="#capacitor" x="201" y="257"/><use href="#capacitor" x="201" y="271"/><use href="#capacitor" x="201" y="289"/>
