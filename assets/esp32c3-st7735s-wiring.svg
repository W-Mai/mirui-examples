    <use href="#capacitor" x="251" y="340"/><use href="#capacitor" x="250" y="353"/>
    <rect x="228" y="380" width="53" height="17" rx="2" fill="#bb8270" stroke="#ecd1ae"/>
    <path d="M234 383H275" stroke="#ecb6a1"/>
    <text class="mark" x="255" y="371" text-anchor="middle">SUPER MINI</text>
    <use href="#pad" x="168" y="161"/><text class="silk" x="182" y="161" text-anchor="start">5</text>
    <use href="#pad" x="168" y="192"/><text class="silk" x="182" y="192" text-anchor="start">6</text>
    <use href="#pad" x="168" y="223"/><text class="silk" x="182" y="223" text-anchor="start">7</text>
    <use href="#pad" x="168" y="254"/><text class="silk" x="182" y="254" text-anchor="start">8</text>
    <use href="#pad" x="168" y="285"/><text class="silk" x="182" y="285" text-anchor="start">9</text>
    <use href="#pad" x="168" y="316"/><text class="silk" x="182" y="316" text-anchor="start">10</text>
    <use href="#pad" x="168" y="347"/><text class="silk" x="182" y="347" text-anchor="start">20</text>
    <use href="#pad" x="168" y="378"/><text class="silk" x="182" y="378" text-anchor="start">21</text>
    <use href="#pad" x="343" y="161"/><text class="silk" x="330" y="161" text-anchor="end">5V</text>
    <use href="#pad" x="343" y="192"/><text class="silk" x="330" y="192" text-anchor="end">GND</text>
    <use href="#pad" x="343" y="223"/><text class="silk" x="330" y="223" text-anchor="end">3V3</text>
    <use href="#pad" x="343" y="254"/><text class="silk" x="330" y="254" text-anchor="end">4</text>
    <use href="#pad" x="343" y="285"/><text class="silk" x="330" y="285" text-anchor="end">3</text>
    <use href="#pad" x="343" y="316"/><text class="silk" x="330" y="316" text-anchor="end">2</text>
    <use href="#pad" x="343" y="347"/><text class="silk" x="330" y="347" text-anchor="end">1</text>
    <use href="#pad" x="343" y="378"/><text class="silk" x="330" y="378" text-anchor="end">0</text>
  </g>
