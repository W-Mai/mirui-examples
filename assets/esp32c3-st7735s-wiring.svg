  <text x="255" y="434" text-anchor="middle" font-size="15" font-weight="680">ESP32-C3 Super Mini</text>
  <text class="secondary" x="255" y="453" text-anchor="middle" font-size="12">Component side</text>
  <text x="895" y="418" text-anchor="middle" font-size="15" font-weight="680">ST7735S display</text>
  <text class="secondary" x="895" y="437" text-anchor="middle" font-size="12">Back side · 3.3 V supply</text>
  <text class="secondary" x="34" y="547" font-size="13">SCK = SCL · A0 = RS/DC · RESET = RST · VCC connects to 3V3</text>
</svg>
