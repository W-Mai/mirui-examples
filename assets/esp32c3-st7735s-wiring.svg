    </g>
    <rect x="848" y="164" width="29" height="14" rx="2" fill="#eee0cf" opacity=".75"/>
    <rect x="852" y="168" width="21" height="6" rx="1" fill="#292a29"/>
    <text class="mark" x="883" y="175">R1</text>
    <rect x="867" y="307" width="27" height="18" rx="2" fill="#27292b" stroke="#de9690"/>
    <path d="M871 326v5m16-5v5m-8-25v-5" stroke="#eee1c9" stroke-width="3"/>
    <text class="mark" x="899" y="320">U1</text>
    <use href="#capacitor" x="884" y="348"/>
    <text class="mark" x="901" y="356">C1</text>
    <text class="mark" x="1018" y="172" text-anchor="end">1.44″ SPI</text>
    <text class="mark" x="1018" y="188" text-anchor="end">128 × 128</text>
    <text x="959" y="251" text-anchor="middle" class="silk" style="font-size:18px">MSP1443</text>
    <text class="mark" x="959" y="267" text-anchor="middle">ST7735S</text>
    <text class="mark" x="1018" y="372" text-anchor="end">J1</text>
    <use href="#header-pin" x="755" y="168"/><text class="silk" x="773" y="168">LED</text>
    <use href="#header-pin" x="755" y="196"/><text class="silk" x="773" y="196">SCK</text>
    <use href="#header-pin" x="755" y="224"/><text class="silk" x="773" y="224">SDA</text>
    <use href="#header-pin" x="755" y="252"/><text class="silk" x="773" y="252">A0</text>
    <use href="#header-pin" x="755" y="280"/><text class="silk" x="773" y="280">RESET</text>
    <use href="#header-pin" x="755" y="308"/><text class="silk" x="773" y="308">CS</text>
    <use href="#header-pin" x="755" y="336"/><text class="silk" x="773" y="336">GND</text>
    <use href="#header-pin" x="755" y="364"/><text class="silk" x="773" y="364">VCC</text>
