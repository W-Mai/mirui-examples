[package]
name = "mirui-esp32c3"
version = "0.0.1"
edition = "2024"

[features]
default = ["demo-threebody"]
demo-threebody = []
demo-subpixel = []
demo-particles = []
demo-shapes = []
demo-butterfly = []
# HiDPI 下采样模式: 物理 framebuffer 不变(128×128),但 logical 空间扩为 256×256
# (scale=0.5),layout 写 logical,backend 按 scale 在 raster 时下采样。
# 目前与 demo-threebody 联用:6 体 N-body。
demo-hidpi-downscale = []

[package.metadata.esp-hal]

[dependencies]
esp-hal = { version = "1.1.0", features = ["esp32c3"] }
esp-alloc = "0.7"
esp-println = { version = "0.14", features = ["esp32c3"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"] }
# Perf baseline: mirui commit f280542 (160fps three-body, partial refresh)
mirui = { git = "https://github.com/W-Mai/mirui.git", features = ["perf"] }
mirui-macros = { git = "https://github.com/W-Mai/mirui.git" }

[patch."https://github.com/W-Mai/mirui.git"]
mirui = { path = "../../../miru" }
mirui-macros = { path = "../../../miru/mirui-macros" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
