[package]
name = "mirui-esp32c3"
version = "0.0.1"
edition = "2024"

[features]
default = ["demo-threebody"]
# Draw a tiny FPS readout on the LCD after every flush. Off by default
# because the bitmap poke adds ~1% overhead per frame and corrupts
# pixels that the demo re-draws anyway. Flip on for any demo:
#   cargo run ... --features demo-coverflow,fps-overlay
fps-overlay = []
# Spin each small sprite in demo-threebody around its center. No effect
# on other demos. Off by default because the per-body 2D rotation goes
# through the quad path (SDF / supersample) and adds per-frame cost.
spin = []

# Operation wall time, callback cadence and phase budget reports.
# Callback cadence does not measure native display refresh.
perf-fps = ["mirui/perf"]

# Adds per-span aggregates and chrome-trace JSON over UART.
# ESP32-C3's USB Serial-JTAG drains ~64 bytes per USB frame, so
# a busy frame's trace stream materially inflates timing results.
#   cargo run ... --features demo-threebody,perf-trace
perf-trace = ["perf-fps"]

# Dump every 30th frame's `LastDirtyRegions` over UART. Diagnostic
# only — every dump is several extra println calls and pollutes
# perf-fps' UART budget.
perf-plan-probe = ["mirui/perf"]
frame-capture = []

# Internal marker: this demo runs on top of `mirui::App` (ECS world,
# systems, plugins). Consumers never set this directly — each App-family
# demo enables it implicitly via its own feature.
app-demo = []

# Render form and Switch captures, check clipped pixels against full
# frames, and emit base64 frame dumps with FNV-1a hashes over UART.
esp-test-offscreen = []

# App-family demos (ECS-based).
demo-threebody = ["app-demo"]
demo-subpixel = ["app-demo"]
demo-particles = ["app-demo"]
demo-flipcard = ["app-demo"]     # 2.5D single-card flip around Y with perspective.
demo-coverflow = ["app-demo"]
demo-interaction = ["app-demo"]
demo-widgets = ["app-demo"]
demo-effects = ["app-demo"]     # Mirror + BackgroundBlur over a tile grid.
demo-kinetic = ["app-demo"]
demo-curve-text-compact = ["app-demo"]

# shapes and butterfly used to drive FramebufSurface directly; from
# v0.28 they sit inside mirui::gallery::demos as Canvas-style custom
# Views and run on top of mirui::App like every other demo.
demo-shapes = ["app-demo"]
demo-butterfly = ["app-demo"]
demo-life = ["app-demo"]     # Conway's Game of Life on a toroidal grid.
demo-typography = ["app-demo"]
# HiDPI downscale: physical framebuffer stays at 128×128, logical space
# expands to 256×256 (scale = 0.5). Layout is written in logical units;
# the backend downsamples during rasterization. Pairs with demo-threebody
# to fit a 6-body N-body scene.
demo-hidpi-downscale = []
# HiDPI upscale: physical framebuffer 128×128, logical space 64×64
# (scale = 2). Widgets use logical sizes, rastered as 2×2 physical
# blocks — looks pixel-art and benches sw-blit-fast-path's 2× integer
# hot path.
demo-hidpi-upscale = []

[package.metadata.esp-hal]

[dependencies]
esp-hal = { version = "1.1.0", features = ["esp32c3", "unstable"] }
embedded-hal = "1.0"
embedded-alloc = { version = "0.7", default-features = false, features = ["tlsf"] }
esp-println = { version = "0.14", features = ["esp32c3"] }
esp-bootloader-esp-idf = { version = "0.5.0", features = ["esp32c3"] }
# Perf baseline: mirui commit f280542 (160fps three-body, partial refresh).
# `default-features = false` drops quad-aa — the 2×2 supersample costs
# ~7 ms/frame on cover-flow (33 fps → 27 fps) which the C3 can't spare.
# Flip it back on for demos that care about edge quality more than fps.
mirui = { git = "https://github.com/W-Mai/mirui.git", default-features = false, features = ["gallery"] }
mirui-macros = { git = "https://github.com/W-Mai/mirui.git" }
critical-section = "1.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
