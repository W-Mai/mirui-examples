name: NuttX example

on:
  push:
    branches: [main]
    paths:
      - "examples/nuttx_demo/**"
      - ".cargo/config.toml"
      - ".github/workflows/nuttx-example.yml"
      - ".github/workflows/nuttx-runtime.yml"
      - "ci/*nuttx*"
  pull_request:
    paths:
      - "examples/nuttx_demo/**"
      - ".cargo/config.toml"
      - ".github/workflows/nuttx-example.yml"
      - ".github/workflows/nuttx-runtime.yml"
      - "ci/*nuttx*"
  workflow_dispatch:
    inputs:
      cold:
        description: Run without restoring or saving caches
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  runtime:
    uses: ./.github/workflows/nuttx-runtime.yml
    with:
      # Apache NuttX 13.1.0
      nuttx_ref: 2b5c0de5e933281c209f954a63b99cf10c132346
      apps_ref: 3c772ea35b9245972e18999828f7b533e6fc57cc
      cold: ${{ inputs.cold || false }}
      save_cache: true
