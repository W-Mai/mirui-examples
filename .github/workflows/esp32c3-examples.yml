name: ESP32-C3 examples

on:
  push:
    branches: [main]
    paths:
      - "examples/esp32c3-*/**"
      - ".cargo/config.toml"
      - ".github/workflows/esp32c3-examples.yml"
      - "ci/test-esp32c3.py"
      - "ci/prepare-esp32c3-tools.sh"
  pull_request:
    paths:
      - "examples/esp32c3-*/**"
      - ".cargo/config.toml"
      - ".github/workflows/esp32c3-examples.yml"
      - "ci/test-esp32c3.py"
      - "ci/prepare-esp32c3-tools.sh"
  workflow_dispatch:
    inputs:
      cold:
        description: Run without restoring or saving caches
        type: boolean
        default: false

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  firmware:
    name: ESP32-C3 (${{ matrix.example }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example: [animation, chord-prompter]
    defaults:
      run:
        working-directory: examples/esp32c3-${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust and the RV32IMC target
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target riscv32imc-unknown-none-elf
      - name: Restore Rust build dependencies
        if: "!inputs.cold"
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: examples/esp32c3-${{ matrix.example }}
          key: rv32imc-release-${{ matrix.example }}-${{ hashFiles('.github/workflows/esp32c3-examples.yml') }}
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build the firmware
        run: cargo build --locked --release
      - name: Build the offscreen diagnostic
        if: matrix.example == 'animation'
        run: cargo build --locked --release --no-default-features --features esp-test-offscreen
      - name: Install emulator system libraries
        if: matrix.example == 'animation'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgcrypt20 libglib2.0-0t64 \
            libpixman-1-0 libsdl2-2.0-0 libslirp0
      - name: Restore emulator and flash tool archives
        if: "matrix.example == 'animation' && !inputs.cold"
        id: tools
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/esp32c3-archives
          key: esp32c3-tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/prepare-esp32c3-tools.sh') }}
      - name: Verify and unpack emulator and flash tool
        if: matrix.example == 'animation'
        run: bash "$GITHUB_WORKSPACE/ci/prepare-esp32c3-tools.sh" "$RUNNER_TEMP/esp32c3-archives" "$RUNNER_TEMP"
      - name: Run the diagnostic and check rendered frames
        if: matrix.example == 'animation'
        run: |
          "$RUNNER_TEMP/espflash" save-image --chip esp32c3 --merge --flash-size 4mb \
            target/riscv32imc-unknown-none-elf/release/mirui-esp32c3 "$RUNNER_TEMP/offscreen.bin"
          python3 "$GITHUB_WORKSPACE/ci/test-esp32c3.py" "$RUNNER_TEMP/qemu/bin/qemu-system-riscv32" \
            "$RUNNER_TEMP/offscreen.bin" "$GITHUB_WORKSPACE/esp32c3-results"
      - name: Save emulator and flash tool archives
        if: "matrix.example == 'animation' && !inputs.cold && github.ref == 'refs/heads/main' && steps.tools.outputs.cache-hit != 'true'"
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/esp32c3-archives
          key: ${{ steps.tools.outputs.cache-primary-key }}
      - name: Record cache status
        if: always()
        env:
          TOOLS_HIT: ${{ steps.tools.outputs.cache-hit }}
          RUST_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          {
            echo "Tools: ${TOOLS_HIT:-not restored}; Rust: ${RUST_HIT:-not restored}"
            if test -d "$RUNNER_TEMP/esp32c3-archives"; then du -sh "$RUNNER_TEMP/esp32c3-archives"; fi
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.example == 'animation'
        with:
          name: esp32c3-offscreen
          path: esp32c3-results/
