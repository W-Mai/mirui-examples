name: ESP32-C3 examples

on:
  push:
    branches: [main]
    paths:
      - "examples/esp32c3-*/**"
      - ".cargo/config.toml"
      - ".github/workflows/esp32c3-examples.yml"
      - "ci/test-esp32c3.py"
  pull_request:
    paths:
      - "examples/esp32c3-*/**"
      - ".cargo/config.toml"
      - ".github/workflows/esp32c3-examples.yml"
      - "ci/test-esp32c3.py"
  workflow_dispatch:

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: "1.97.0"
  CARGO_TERM_COLOR: always

jobs:
  firmware:
    name: ESP32-C3 (${{ matrix.example }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example: [animation, chord-prompter]
    defaults:
      run:
        working-directory: examples/esp32c3-${{ matrix.example }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Rust and the RV32IMC target
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --target riscv32imc-unknown-none-elf
      - name: Build the firmware
        run: cargo build --locked --release
      - name: Build the offscreen diagnostic
        if: matrix.example == 'animation'
        run: cargo build --locked --release --no-default-features --features esp-test-offscreen
      - name: Install Espressif QEMU and espflash
        if: matrix.example == 'animation'
        working-directory: ${{ runner.temp }}
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libgcrypt20 libglib2.0-0t64 \
            libpixman-1-0 libsdl2-2.0-0 libslirp0
          curl --fail --location --retry 3 -o qemu.tar.xz \
            https://github.com/espressif/qemu/releases/download/esp-develop-9.2.2-20261109/qemu-riscv32-softmmu-esp_develop_9.2.2_20261109-x86_64-linux-gnu.tar.xz
          echo 'afa59465495295b8aa4f804768983fa30b0bbf33d0f68a047f9caa436b9164c0  qemu.tar.xz' | sha256sum -c
          tar -xf qemu.tar.xz
          curl --fail --location --retry 3 -o espflash.zip \
            https://github.com/esp-rs/espflash/releases/download/v4.4.0/espflash-x86_64-unknown-linux-gnu.zip
          echo 'ac2031bd1f04c9107d9ba0e977535daa885a9f533f937dc369debd77f83665cd  espflash.zip' | sha256sum -c
          unzip espflash.zip
      - name: Run the diagnostic and check rendered frames
        if: matrix.example == 'animation'
        run: |
          "$RUNNER_TEMP/espflash" save-image --chip esp32c3 --merge --flash-size 4mb \
            target/riscv32imc-unknown-none-elf/release/mirui-esp32c3 "$RUNNER_TEMP/offscreen.bin"
          python3 "$GITHUB_WORKSPACE/ci/test-esp32c3.py" "$RUNNER_TEMP/qemu/bin/qemu-system-riscv32" \
            "$RUNNER_TEMP/offscreen.bin" "$GITHUB_WORKSPACE/esp32c3-results"
      - uses: actions/upload-artifact@v4
        if: always() && matrix.example == 'animation'
        with:
          name: esp32c3-offscreen
          path: esp32c3-results/
